name: .NET CI

on:
  push:
    branches:
      - main
    paths:
      - "Directory.Build.props"
      - "Geoscape/**"
      - "lib/ref/**"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Directory.Build.props"
      - "Geoscape/**"
      - "lib/ref/**"
      - ".github/workflows/dotnet-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify (Zero Warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore Geoscape/Source/Geoscape.slnx

      - name: Build Solution (Zero-Warning Enforcement)
        run: dotnet build Geoscape/Source/Geoscape.slnx --configuration Release --no-restore /p:TreatWarningsAsErrors=true
