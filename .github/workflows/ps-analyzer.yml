name: PSScriptAnalyzer

on:
  push:
    branches:
      - main
    paths:
      - "**.ps1"
      - "**.psm1"
      - "**.psd1"
  pull_request:
    branches:
      - main
    paths:
      - "**.ps1"
      - "**.psm1"
      - "**.psd1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $psFiles = git ls-files '*.ps1' '*.psm1' '*.psd1'
          if ($psFiles) {
            Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
            $results = $psFiles | Invoke-ScriptAnalyzer
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) {
              $errors | Format-Table
              exit 1
            }
          } else {
            Write-Host "No PowerShell files found to analyze."
          }
